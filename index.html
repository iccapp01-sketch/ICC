    <!-- OneSignal SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        try {
          // Fix: Only initialize OneSignal if we are on the registered domain or localhost to avoid domain errors
          const authorizedDomains = ["classy-moonbeam-75a77f.netlify.app", "localhost", "127.0.0.1"];
          const currentHost = window.location.hostname;
          if (authorizedDomains.some(domain => currentHost.includes(domain))) {
            await OneSignal.init({
              appId: "72bf3af9-75ff-4d8d-8d84-4ce1bc38ca04",
              safari_web_id: "web.onesignal.auto.10a9f1f0-4d43-4f9b-8f1d-2b7e9b0e9f1e",
              notifyButton: {
                enable: false,
              },
            });
          } else {
            console.warn("OneSignal: Skipping init on unauthorized domain:", currentHost);
          }
        } catch (e) {
          console.error("OneSignal Init Error:", e);
        }
      });
    </script>

    <script src="https://cdn.tailwindcss.com"></script>

              'fade-in': { '0%': { opacity: '0' }, '100%': { opacity: '1' } }
            }
          }
        }
      }
    </script>
